# =============================================================================
# KuppiHub – docker-compose.yml
# =============================================================================
# Run the containerised app with a single command:
#
#   docker compose up --build
#
# Requirements:
#   - Docker Desktop (Windows/Mac) or Docker Engine (Linux)
#   - A filled-in .env file (copy env.example → .env and fill in values)
#
# How it works:
#   - NEXT_PUBLIC_* vars are read from .env and passed as build args
#     (they get baked into the JS bundle at build time).
#   - All other secrets are injected at runtime via env_file.
# =============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Pass public vars as build-time args (read from .env automatically)
      args:
        - NEXT_PUBLIC_FIREBASE_API_KEY
        - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        - NEXT_PUBLIC_FIREBASE_PROJECT_ID
        - NEXT_PUBLIC_TURNSTILE_SITE_KEY
    # Inject all secrets at runtime
    env_file:
      - .env
    ports:
      - "3000:3000"
    restart: unless-stopped
